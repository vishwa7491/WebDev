<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="es.css">
</head>
<body>
    <h1 id="heading">Etch-a-Sketch</h1>
    <div class="game">
        <div class="options">
            <button class="option" id="black">Black</button>
            <button class="option" id="grey">Grey</button>
            <button class="option" id="color">Color</button>
            <button class="option" id="eraser">Eraser</button>
            <div class="adjSize">
                <input type="number" min="0" id="size-ip" placeholder=" Enter size..."/>
                <button class="option" id="set-size">Set Size</button>    
            </div>
            <button class="option" id="clear">Clear</button>
        </div>
        <div class="grid"></div>
    </div>
    <script src="ES.js"></script>
</body>
</html>
